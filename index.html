<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My School</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
scroll-behavior:smooth;
}

body{
background:#eef4ff;
}

nav{
background:#003366;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
position:sticky;
top:0;
}

.logo{
color:white;
font-size:28px;
font-weight:bold;
}

nav ul{
display:flex;
list-style:none;
}

nav ul li{
margin-left:25px;
}

nav ul li a{
color:white;
text-decoration:none;
font-size:18px;
}

.hero{
height:90vh;
background:url("school.jpg") center/cover;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
text-align:center;
}

.hero h1{
font-size:60px;
text-shadow:2px 2px 10px black;
}

.hero p{
font-size:22px;
margin:20px;
}

.btn{
padding:15px 35px;
background:#ff9800;
color:white;
text-decoration:none;
border-radius:40px;
font-size:20px;
transition:.3s;
}

.btn:hover{
background:#ff6f00;
transform:scale(1.1);
}

.subjects{
padding:70px;
text-align:center;
}

.subjects h2{
font-size:40px;
margin-bottom:40px;
color:#003366;
}

.cards{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:30px;
}

.card{
background:white;
width:300px;
padding:30px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,.2);
transition:.4s;
}

.card:hover{
transform:translateY(-12px);
}

.icon{
font-size:70px;
}

.card h3{
margin:20px;
color:#003366;
}

.card a{
display:inline-block;
margin-top:15px;
padding:12px 25px;
background:#007BFF;
color:white;
text-decoration:none;
border-radius:30px;
}

footer{
background:#003366;
color:white;
text-align:center;
padding:25px;
margin-top:50px;
}
</style>

</head>
